<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>轻量个人知识库</title>

  <!-- 主题切换:同步内联初始化,防止 dark 首屏闪烁 -->
  <script>
    (function () {
      var key = 'lqd-theme';
      var legacy = 'book-theme';
      var saved = localStorage.getItem(key) || localStorage.getItem(legacy);
      var effective = saved;
      if (effective !== 'light' && effective !== 'dark') {
        effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', saved || 'auto');
      document.documentElement.setAttribute('data-effective-theme', effective);
    })();
  </script>

  <!-- 字体:Noto Sans SC + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">

  <!-- 全局错误捕获:必须是第一个 defer 脚本,先装好捕获器再加载其余模块 -->

  <!-- KaTeX:数学渲染,auto-render 处理 $...$ 和 $$...$$ -->

  <script defer src="/frontend/katex/auto-render.min.js"></script>

<body>
  <!-- 命令面板 -->
  <div class="lqd-command-palette" id="lqd-command-palette" hidden>
    <input class="lqd-cp-input" id="lqd-cp-input" type="text" placeholder="输入命令或搜索..." autocomplete="off">
    <div class="lqd-cp-list" id="lqd-cp-list"></div>
  </div>

  <!-- Trae 风格五栏布局:Activity Bar + Sidebar + Main(Tab+Body) + Overview + Status Bar -->
  <div class="lqd-shell" id="lqd-shell">
    <!-- 最左:图标条 -->
    <nav class="lqd-activity-bar" id="lqd-activity-bar" aria-label="主导航"></nav>

    <!-- 左侧上下文面板 -->
    <aside class="lqd-sidebar" id="lqd-sidebar">
      <div class="lqd-sidebar-header" id="lqd-sidebar-header"></div>
      <div class="lqd-sidebar-body" id="lqd-sidebar-body"></div>
    </aside>

    <!-- 主内容区 -->
    <main class="lqd-main" id="lqd-main">
      <div class="lqd-tab-bar" id="lqd-tab-bar"></div>
      <div class="lqd-main-body" id="lqd-main-body"></div>
    </main>

    <!-- 右侧概览面板 -->
    <aside class="lqd-overview" id="lqd-overview">
      <div class="lqd-overview-header" id="lqd-overview-header">上下文</div>
      <div class="lqd-overview-body" id="lqd-overview-body"></div>
    </aside>

    <!-- 底部状态栏 -->
    <footer class="lqd-status-bar" id="lqd-status-bar"></footer>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // KaTeX 自动渲染。注意:katex 内部对非 ParseError(如非法输入 TypeError)
      // 即使 throwOnError:false 也会重抛,必须自己兜住,避免页面初始化中断。
      if (window.renderMathInElement) {
        try {
          renderMathInElement(document.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "\\[", right: "\\]", display: true },
              { left: "\\(", right: "\\)", display: false },
              { left: "$", right: "$", display: false }
            ],
            ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
            ignoredClasses: ["pseudocode"],
            throwOnError: false
          });
        } catch (e) {
          if (window.LqdErrors) window.LqdErrors.report(e, 'katex-auto-render');
        }
      }
    });
  </script>
</body>
