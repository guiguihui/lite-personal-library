<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LQ-D · 品牌 Logo 设计稿</title>
<style>
  :root{
    --bg:#0e1013;
    --panel:#15171d;
    --panel-2:#1a1d25;
    --line:rgba(255,255,255,.07);
    --fg:#e9e9ec;
    --fg-2:#9a9aa3;
    --fg-3:#6b6b76;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
    --sans:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(124,92,255,.08), transparent 60%),
      var(--bg);
    color:var(--fg);
    font-family:var(--sans);
    min-height:100vh;
    padding:56px 40px 72px;
    -webkit-font-smoothing:antialiased;
  }
  header{max-width:1240px;margin:0 auto 48px}
  .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.28em;
    color:var(--fg-3);text-transform:uppercase;
    display:flex;align-items:center;gap:14px;margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,#7c5cff,#5a9bff)}
  h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  h1 em{font-style:normal;background:linear-gradient(90deg,#a08bff,#6fb1ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:12px;color:var(--fg-2);font-size:14px;line-height:1.7}
  .sub b{color:var(--fg);font-weight:600}

  .grid{
    max-width:1240px;margin:0 auto;
    display:grid;grid-template-columns:repeat(5,1fr);gap:18px;
  }
  @media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr)}}

  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 18px 22px;
    display:flex;flex-direction:column;align-items:center;gap:16px;
    position:relative;overflow:hidden;
    transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s;
  }
  .card:hover{transform:translateY(-5px);box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
  .card:hover .badge{transform:scale(1.06)}
  .card:hover .badge::after{opacity:1}

  /* 编号 + 类型 */
  .meta{width:100%;display:flex;justify-content:space-between;align-items:baseline}
  .num{font-family:var(--mono);font-size:11px;color:var(--fg-3);letter-spacing:.1em}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--fg-3);border:1px solid var(--line);border-radius:99px;padding:2px 8px}

  /* 徽章 */
  .badge{
    width:88px;height:88px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    position:relative;flex-shrink:0;
    background:radial-gradient(120% 120% at 30% 20%, #262a34, #16181e 70%);
    border:1px solid var(--line);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .badge::before{content:"";position:absolute;inset:0;border-radius:inherit;
    background:var(--glow);opacity:.16;filter:blur(14px)}
  .badge::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(145deg,var(--edge1),transparent 40%,var(--edge2));
    opacity:.5;transition:opacity .35s}
  .badge svg{width:46px;height:46px;position:relative;z-index:1}

  /* 文案 */
  .name{font-size:15px;font-weight:600;letter-spacing:-.01em;text-align:center}
  .en{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--fg-3);
    text-transform:uppercase;margin-top:2px}
  .desc{font-size:12px;color:var(--fg-2);line-height:1.65;text-align:center;min-height:40px}

  /* 分节标题 */
  .section-divider{
    max-width:1240px;margin:64px auto 8px;
    display:flex;align-items:center;gap:14px;
  }
  .section-divider .t{
    font-family:var(--mono);font-size:11px;letter-spacing:.26em;
    color:var(--fg-2);text-transform:uppercase;white-space:nowrap;
  }
  .section-divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .section-divider .hint{font-family:var(--sans);font-size:12px;color:var(--fg-3);letter-spacing:0}

  /* ── 扁平化卡片:实色块,无渐变/光晕/描边 ── */
  .card--flat .badge{
    border:none;
    background:var(--flat);
    box-shadow:0 10px 24px -14px var(--flat);
  }
  .badge--flat::before,.badge--flat::after{display:none}
  .card--flat .desc{min-height:40px}

  footer{max-width:1240px;margin:52px auto 0;color:var(--fg-3);font-size:12px;
    font-family:var(--mono);letter-spacing:.04em;text-align:center}
</style>
</head>
<body>

<header>
  <div class="eyebrow">LQ-D · Brand Identity · 10 Concepts</div>
  <h1>LQ-D 品牌 <em>Logo</em> 设计稿</h1>
  <p class="sub">个人知识库 × AI 助手 — <b>高级 · 创新 · 简约</b>。悬停可预览微交互，点击任一款即可采纳并应用到应用。</p>
</header>

<main class="grid" id="grid"></main>

<div class="section-divider">
  <span class="t">Flat · 扁平化系列</span>
  <span class="hint">实色几何，无渐变 · 无描边 · 现代明快</span>
</div>
<main class="grid" id="grid-flat" style="margin-top:22px"></main>

<div class="section-divider">
  <span class="t">LQ · 书架 × 放大镜</span>

</div>
<main class="grid" id="grid-lq" style="margin-top:22px"></main>

<footer>© 2026 LQ-D · 所有 logo 为内联 SVG，可直接嵌入应用（frontend/core/icons.js）</footer>
