[project]
name = "lq-d"
version = "0.1.0"
description = "LQ-D — Python 桌面知识库应用"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # HTTP 服务
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    # 配置
    "pyyaml>=6.0",
    # 桌面壳
    "pywebview>=5.0",
    # PDF 提取(阶段 4)
    "PyMuPDF>=1.24",
    "pdfplumber>=0.10",
    # HTTP 客户端(MinerU API + LLM 代理,阶段 4/6)
    "httpx[socks]>=0.27",
    # BYOK key 加密(可选,无则降级明文)
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "httpx[socks]>=0.27",  # 测试客户端
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "slow: 慢测试(需要外部依赖)",
]
